<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b5121b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XC Staff App"><link rel="manifest" href="manifest.json"><link rel="icon" href="crosscountry-logo-white.png"><title>🚫 Reservations / Full & Standing</title><style>
:root{--red:#b5121b;--gold:#f5c242;--bg:#f4f4f4;--text:#222;--muted:#666;--border:#d8d8d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--red);color:#fff;padding:14px 16px;border-bottom:5px solid var(--gold)}
.top{display:flex;align-items:center;gap:12px}.logo{background:#fff;border-radius:8px;padding:4px 7px;width:145px;height:36px;object-fit:contain}
.back{color:#fff;text-decoration:none;font-weight:800;font-size:14px}.heading{margin-top:10px;font-size:24px;font-weight:850}
main{max-width:650px;margin:auto;padding:18px 16px 35px}.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px #00000010}
label{display:block;font-size:14px;font-weight:800;margin:0 0 7px}input,select,textarea{width:100%;border:1px solid #bbb;border-radius:10px;padding:12px;font:inherit;background:#fff}textarea{min-height:130px;resize:vertical}
.field{margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:13px;color:var(--muted);line-height:1.45}
button{width:100%;border:0;border-radius:11px;padding:14px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:#eee;color:#222}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{text-align:center;color:#666;font-size:13px;margin-top:10px;min-height:18px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 4px;border-bottom:1px solid #ddd;text-align:left}th{font-size:12px}
@media(max-width:480px){.grid,.actions{grid-template-columns:1fr}}
.main-menu-wrap{max-width:700px;margin:12px auto 0;padding:0 14px}.main-menu-btn{display:block;text-align:center;text-decoration:none;background:#fff;color:#b5121b;border:1px solid #b5121b;border-radius:10px;padding:11px 14px;font-weight:800;font-size:15px}<style>.pdf-action{margin:10px 0}.pdf-action button{width:100%;background:#222;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800}</style></style><style id="xc-safe-area">
html{background:#b5121b}
body{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
</style><style id="xc-main-menu-style">
.xc-main-menu{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;background:#b5121b;color:#fff;border-radius:10px;padding:11px 14px;margin:0 0 12px;font-weight:800;border:0}
.xc-main-menu:hover,.xc-main-menu:active{background:#8f0f16;color:#fff}
</style><style id="xc-header-logo">
.xc-page-header-logo{width:86px;height:24px;object-fit:contain;display:block;flex:0 0 auto}
</style><style id="xc-uniform-inputs">
/* XC uniform form controls */
input[type="text"],input[type="number"],input[type="date"],input[type="time"],
input[type="email"],input[type="tel"],input[type="search"],input[type="url"],
input:not([type]),select,textarea{
  width:100%;
  min-height:44px;
  height:44px;
  box-sizing:border-box;
  padding:10px 11px;
  border:1px solid #bbb;
  border-radius:9px;
  font:inherit;
  line-height:1.25;
  background:#fff;
}
textarea{
  height:120px;
  min-height:120px;
  resize:vertical;
}
</style></head><body><header class="xc-compact-header"><img class="xc-page-header-logo" src="crosscountry-logo-white.png" alt="XC"></header>
<header><a class="back" href="index.html">‹ Back to Staff App</a><div class="heading">🚫 Reservations / Full & Standing</div></header><div class="main-menu-wrap"></div><main><a class="xc-main-menu" href="index.html">← Main menu</a><div class="card"><div class="grid"><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Headcode</label><input id="head"></div><div class="field"><label>Original Departure Time</label><input id="departure" type="time"></div><div class="field"><label>From</label><input id="from"></div><div class="field"><label>To</label><input id="to"></div></div></div><div class="card"><label>Report</label><select id="report"><option>Close reservations</option><option>Full & standing service</option><option>Close reservations and full & standing</option></select></div><div class="card"><label>Details</label><textarea id="details"></textarea></div><div class="card"><button class="primary" type="button" onclick="emailMsg()">Generate Message</button></div><div class="pdf-action"><button type="button" onclick="xcGeneratePDF('Reservations')">📄 Generate PDF</button></div></main><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});date.value=new Date().toISOString().slice(0,10);
function msg(){
  let d=date.value.split("-").reverse().join(" ");
  let action="";
  if(report.value==="Close reservations"){
    action="close reservations";
  }else if(report.value==="Full & standing service"){
    action="show a full and standing service";
  }else{
    action="close reservations and show full and standing service";
  }
  return `Hello, could you please ${action} (as selected)
On ${head.value} on ${d}
This is the train ${from.value} to ${to.value}

Details: ${details.value}`;
}
function emailMsg(){
  location.href="mailto:?subject="+encodeURIComponent(report.value+" - "+head.value)+"&body="+encodeURIComponent(msg());
}</script><script>
function xcGeneratePDF(title){
 const lines=[title,"","XC STAFF APP",""];
 document.querySelectorAll("input,select,textarea").forEach(el=>{
  if(el.value){const l=el.closest(".field")?.querySelector("label")?.innerText||el.name||el.id||"Entry";lines.push(l+": "+el.value)}
 });
 const esc=v=>String(v).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").replace(/\r?\n/g," ");
 const W=595,H=842,m=42,lead=14,pages=[[]];let y=H-m;
 lines.forEach(x=>{if(y<55){pages.push([]);y=H-m}pages.at(-1).push(x);y-=lead});
 let o=[],add=x=>(o.push(x),o.length),po=add(""),fo=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"),refs=[];
 pages.forEach(ls=>{let c="BT /F1 10 Tf "+m+" "+(H-m)+" Td ";ls.forEach((x,i)=>{if(i)c+=" 0 -14 Td ";c+="("+esc(x)+") Tj "});c+=" ET";let st=add("<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream");refs.push(add("<< /Type /Page /Parent "+po+" 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /Font << /F1 "+fo+" 0 R >> >> /Contents "+st+" 0 R >>"))});
 o[po-1]="<< /Type /Pages /Count "+refs.length+" /Kids ["+refs.map(x=>x+" 0 R").join(" ")+"] >>";
 let cat=add("<< /Type /Catalog /Pages "+po+" 0 R >>"),pdf="%PDF-1.4\n",off=[0];
 o.forEach((x,i)=>{off.push(pdf.length);pdf+=(i+1)+" 0 obj\n"+x+"\nendobj\n"});
 let xr=pdf.length;pdf+="xref\n0 "+(o.length+1)+"\n0000000000 65535 f \n";for(let i=1;i<off.length;i++)pdf+=String(off[i]).padStart(10,"0")+" 00000 n \n";
 pdf+="trailer\n<< /Size "+(o.length+1)+" /Root "+cat+" 0 R >>\nstartxref\n"+xr+"\n%%EOF";
 let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([pdf],{type:"application/pdf"}));a.download=title.replace(/[^a-z0-9]+/gi,"-")+".pdf";a.click();
}
</script></body></html>
