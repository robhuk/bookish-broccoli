 });

 pages.forEach(ls=>{let c="BT /F1 10 Tf "+m+" "+(H-m)+" Td ";ls.forEach((x,i)=>{if(i)c+=" 0 -14 Td ";c+="("+esc(x)+") Tj "});c+=" ET";let st=add("<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream");refs.push(add("<< /Type /Page /Parent "+po+" 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /Font << /F1 "+fo+" 0 R >> >> /Contents "+st+" 0 R >>"))});
 o[po-1]="<< /Type /Pages /Count "+refs.length+" /Kids ["+refs.map(x=>x+" 0 R").join(" ")+"] >>";
 let cat=add("<< /Type /Catalog /Pages "+po+" 0 R >>"),pdf="%PDF-1.4\n",off=[0];

 let xr=pdf.length;pdf+="xref\n0 "+(o.length+1)+"\n0000000000 65535 f \n";for(let i=1;i<off.length;i++)pdf+=String(off[i]).padStart(10,"0")+" 00000 n \n";
 pdf+="trailer\n<< /Size "+(o.length+1)+" /Root "+cat+" 0 R >>\nstartxref\n"+xr+"\n%%EOF";

<script id="xc-standard-actions-v104">
(function(){
 function callFirst(names, evt){
   for(const n of names){
     if(typeof window[n]==="function"){ try{ window[n](evt); return true; }catch(e){ console.error(e); } }
   }
   return false;
 }
 document.addEventListener("click",function(e){
   const b=e.target.closest("button");
   if(!b)return;
   const id=(b.id||"").toLowerCase();
   const text=(b.textContent||"").trim().toLowerCase();
   if(id==="copy"||id==="copybtn"||text==="copy"||text.includes("copy")){
     if(callFirst(["copyReport","copyData","copyCounts","copyAll","copyToClipboard","copyForm"],e)) return;
   }
   if(id==="email"||id==="emailbtn"||text.includes("email")){
     if(callFirst(["emailReport","emailData","emailCounts","emailAll","sendEmail","emailForm"],e)) return;
   }

   }
   if(id==="clear"||id==="clearbtn"||text==="clear"||text.includes("clear all")){
     if(callFirst(["clearForm","clearAll","clearNotes","clearData","clearCounts","resetForm"],e)) return;
   }
 });
})();

<script>
(function(){
  const key='xc_page_data_'+location.pathname.split('/').pop();
  function fields(){return [...document.querySelectorAll('input,textarea,select')].filter(e=>e.type!=='button'&&e.type!=='submit'&&e.type!=='reset');}
  function save(){const data={};fields().forEach((e,i)=>{const k=e.id||e.name||('field_'+i);data[k]={v:e.type==='checkbox'?e.checked:e.value,t:e.type};});localStorage.setItem(key,JSON.stringify(data));alert('Data saved.');}
  function clear(){if(!confirm('Are you sure you want to clear all data on this page?'))return;fields().forEach(e=>{if(e.type==='checkbox'||e.type==='radio')e.checked=false;else if(e.type!=='hidden')e.value='';e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));});localStorage.removeItem(key);}
  function restore(){try{const data=JSON.parse(localStorage.getItem(key)||'{}');fields().forEach((e,i)=>{const k=e.id||e.name||('field_'+i),d=data[k];if(!d)return;if(e.type==='checkbox')e.checked=!!d.v;else e.value=d.v;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));});}catch(_){}}
  document.addEventListener('DOMContentLoaded',()=>{
    const bar=document.createElement('div');bar.className='global-page-data-controls';bar.innerHTML='<button type="button" aria-label="Save data" title="Save data">💾</button><button type="button" aria-label="Clear data" title="Clear data">🗑️</button>';document.body.appendChild(bar);
    bar.children[0].addEventListener('click',save);bar.children[1].addEventListener('click',clear);restore();
  });
})();
</script>

<script id="humanReadableReportTextV152">
(function(){
  function tidyText(text){
    return String(text||"")
      .replace(/[ \t]+\n/g,"\n")
      .replace(/\n{3,}/g,"\n\n")
      .replace(/ +([,.;:!?])/g,"$1")
      .replace(/\bhello,\s*/i,"Hello,\n\n")
      .replace(/\bthanks\s*$/i,"Thanks")
      .trim();
  }
  document.addEventListener("DOMContentLoaded",function(){
    // Apply only to generated report/email previews, not user input fields.
    document.querySelectorAll("#generatedReport,#generatedEmail,#output,#emailPreview,.generated-report,.email-preview,.report-output").forEach(function(el){
      if(el.matches("textarea,input")) return;
      var original=el.textContent;
      if(original && original.trim()) el.textContent=tidyText(original);
    });
  });
})();
</script>

<script id="reservation-email-format-v155">
(function(){
  function val(ids){
    for(const id of ids){
      const el=document.getElementById(id) || document.querySelector('[name="'+id+'"]');
      if(el && String(el.value||'').trim()) return String(el.value).trim();
    }
    return '';
  }
  function findByLabel(words){
    const inputs=[...document.querySelectorAll('input,textarea,select')];
    for(const el of inputs){
      const hay=(el.id+' '+el.name+' '+el.placeholder+' '+(el.getAttribute('aria-label')||'')).toLowerCase();
      if(words.some(w=>hay.includes(w))) {
        const v=String(el.value||'').trim();
        if(v) return v;
      }
    }
    return '';
  }
  window.formatReservationEmailV155=function(){
    const headcode=val(['headcode','headCode']) || findByLabel(['headcode']);
    const date=val(['date','reportDate','serviceDate']) || findByLabel(['date']);
    const report=val(['report','reportText','action','reportType']) || findByLabel(['report']);
    const departure=val(['departureTime','originalDeparture','originalTime','depTime']) || findByLabel(['original','departure']);
    const from=val(['from','origin']) || findByLabel(['from','origin']);
    const to=val(['to','destination']) || findByLabel(['to','destination']);
    const details=val(['details','additionalDetails','notes','otherInfo']) || findByLabel(['detail','additional','note','information']);

    const subject=`REPORT - ${headcode || 'HEADCODE'} - ${date || 'DATE'}`;
    let body=`Hello,\n\nPlease ${report || '[REPORT]'} on ${headcode || 'HEADCODE'} (${departure || 'ORIGINAL DEPARTURE TIME'}, ${from || 'FROM'} - ${to || 'TO'})`;
    if(details) body += `\n\n${details}`;
    return {subject, body};
  };

  // Patch the page's generated output immediately before preview/copy/email actions.
  function applyFormat(){
    const r=window.formatReservationEmailV155();
    const subjectEls=document.querySelectorAll('#emailSubject,#subject, [data-output="subject"], .email-subject');
    subjectEls.forEach(el=>{ if('value' in el) el.value=r.subject; else el.textContent=r.subject; });
    const bodyEls=document.querySelectorAll('#generatedEmail,#emailBody,#output,#emailPreview,[data-output="body"],.email-preview,.report-output');
    bodyEls.forEach(el=>{ if('value' in el) el.value=r.body; else el.textContent=r.body; });
  }
  document.addEventListener('DOMContentLoaded',function(){
    document.querySelectorAll('button').forEach(btn=>{
      const t=(btn.textContent||'').toLowerCase();
      if(/generate|email|copy|share/.test(t)) btn.addEventListener('click',()=>setTimeout(applyFormat,0));
    });
  });
  window.addEventListener('beforeprint',applyFormat);
})();
</script>

<script id="reservations-full-email-v160">
(function(){
  function get(names){
    for(const n of names){
      const el=document.getElementById(n)||document.querySelector('[name="'+n+'"]');
      if(el && String(el.value||"").trim()) return String(el.value).trim();
    }
    return "";
  }
  function find(words){
    for(const el of document.querySelectorAll("input,textarea,select")){
      const hay=((el.id||"")+" "+(el.name||"")+" "+(el.placeholder||"")+" "+(el.getAttribute("aria-label")||"")).toLowerCase();
      if(words.some(w=>hay.includes(w))){
        const v=String(el.value||"").trim();
        if(v) return v;
      }
    }
    return "";
  }

  window.formatReservationsEmailV160=function(){
    const report=get(["report","reportType","action","request"])||find(["report","request","reservation","standing"]);
    const headcode=get(["headcode","headCode"])||find(["headcode"]);
    const date=get(["date","reportDate","serviceDate"])||find(["date"]);
    const departure=get(["departureTime","originalDeparture","originalTime","depTime"])||find(["original","departure"]);
    const from=get(["from","origin"])||find(["from","origin"]);
    const to=get(["to","destination"])||find(["to","destination"]);
    const details=get(["details","additionalDetails","notes","otherInfo","additionalInfo"])||find(["detail","additional","note","information"]);

    const reportText=report||"REPORT";
    const subject=`${reportText} - ${headcode||"HEADCODE"} - ${date||"DATE"}`;

    let body=`Hello,\n\nPlease ${reportText.toLowerCase()} on ${headcode||"HEADCODE"} (${departure||"ORIGINAL DEPARTURE TIME"}, ${from||"FROM"} - ${to||"TO"}).`;
    if(details) body+=`\n\n${details}`;
    return {subject,body};
  };

  function apply(){
    const r=window.formatReservationsEmailV160();
    document.querySelectorAll("#emailSubject,#subject,[data-output='subject'],.email-subject").forEach(el=>{
      if("value" in el) el.value=r.subject; else el.textContent=r.subject;
    });
    document.querySelectorAll("#generatedEmail,#emailBody,#output,#emailPreview,[data-output='body'],.email-preview,.report-output").forEach(el=>{
      if("value" in el) el.value=r.body; else el.textContent=r.body;
    });
  }

  document.addEventListener("DOMContentLoaded",function(){
    document.querySelectorAll("button").forEach(btn=>{
      const t=(btn.textContent||"").toLowerCase();
      if(/email|copy|share|generate|preview/.test(t)) btn.addEventListener("click",()=>setTimeout(apply,0));
    });
  });
})();
</script>

<script id="xc-share-email-original-v161">
(function(){
  function clean(s){return String(s||"").replace(/\r/g,"").replace(/\n{3,}/g,"\n\n").trim();}
  function outputText(){
    for(const e of document.querySelectorAll("#generatedEmail,#emailPreview,#emailBody,#generatedReport,#output,.email-preview,.report-output")){
      const t=clean(("value" in e && e.value)?e.value:(e.innerText||e.textContent));
      if(t) return t;
    } return "";
  }
  function subjectText(){
    for(const e of document.querySelectorAll("#emailSubject,#subject,[data-output='subject'],.email-subject")){
      const t=clean(("value" in e && e.value)?e.value:(e.innerText||e.textContent));
      if(t) return t;
    } return "";
  }
  window.xcShareOriginalEmailV161=function(){
    let subject=subjectText(), body=outputText();
    if(typeof window.formatStaffDelayEmailV158==="function"){
      const r=window.formatStaffDelayEmailV158(); subject=r.subject; body=r.body;
    } else if(typeof window.formatBookOffLateEmailV159==="function"){
      const r=window.formatBookOffLateEmailV159(); subject=r.subject; body=r.body;
    } else if(typeof window.formatReservationsEmailV160==="function"){
      const r=window.formatReservationsEmailV160(); subject=r.subject; body=r.body;
    } else if(typeof window.formatReservationEmailV155==="function"){
      const r=window.formatReservationEmailV155(); subject=r.subject; body=r.body;
    } else if(document.title.toLowerCase().includes("incident") && typeof window.reportText==="function"){
      const hc=(document.getElementById("headcode")||{}).value||"HEADCODE";
      const dv=(document.getElementById("date")||{}).value||"DATE";
      subject="Incident initial report for "+hc+" on "+dv;
      body=window.reportText();
    }
    location.href="mailto:?subject="+encodeURIComponent(clean(subject))+"&body="+encodeURIComponent(clean(body));
  };
  document.addEventListener("DOMContentLoaded",function(){
    document.querySelectorAll("button,a,[role='button']").forEach(function(el){
      const t=((el.textContent||"")+" "+(el.getAttribute("aria-label")||"")+" "+(el.title||"")).toLowerCase();
      if(/share\s*(via)?\s*email|email\s*share|share.*email/.test(t)){
        el.addEventListener("click",function(e){
          e.preventDefault(); e.stopImmediatePropagation();
          window.xcShareOriginalEmailV161();
        },true);
      }
    });
  });
})();
</script>
