<header><a class="back" href="index.html">‹ Back to Staff App</a><div class="heading">🚆 Report a Delay to Line Manager</div></header><div class="main-menu-wrap"></div><main><a class="xc-main-menu" href="index.html">← Main menu</a><div class="card">
<div class="grid">
<div class="field"><label>Date</label><input data-report-label="Date of incident" id="date" type="date"/></div>
<div class="field"><label>Headcode</label><input id="head" placeholder="e.g. 1V50"/></div>
<div class="field"><label>Minutes Delayed</label><input id="mins" inputmode="numeric" min="0" placeholder="Minutes" type="number"/></div>
<div class="field"><label>Location</label><input id="loc" placeholder="Where did the delay occur?"/></div>
</div></div>
<div class="card"><label>Delay</label>
<div id="delayDisplay" style="font-size:28px;font-weight:850;padding:8px 0">0 minutes</div></div>
<div class="card"><label>Cause</label>
<select id="cause">
<option>Other</option><option>Passenger-related</option><option>Train crew / staffing</option>
<option>Train fault / technical</option><option>Signalling</option><option>Points / route setting</option>
<option>Infrastructure</option><option>External / trespass</option><option>Weather</option>
<option>Congestion / regulation</option>
</select>
<div class="field" style="margin-top:12px"><input id="other" placeholder="If Other, enter cause"/></div></div>
<div class="card"><label>Control Desk Aware?</label>
<select id="control"><option>No (Minor)</option><option>Yes SNE</option><option>Yes MMA</option>
<option>Yes South Coast</option><option>Yes South West</option><option>Other</option></select></div>
<div class="card"><label>Any other information</label>
<textarea data-report-label="Any additional notes or information" id="notes" placeholder="Optional notes"></textarea></div>
<div class="card"><button class="primary" onclick="emailMsg()" type="button">Generate Message</button>
<div class="status" id="status"></div></div><div class="pdf-action"><button button="" delay="" generate="" id="generatePDF" pdf<="" report')"="" type="button" 📄=""></button></div><div class="actions"></div></main><script>date.value=new Date().toISOString().slice(0,10);
function updateDelay(){
 const n=Math.max(0,Number(mins.value)||0);
 delayDisplay.textContent=n+" minute"+(n===1?"":"s");
 delayDisplay.style.color=n<10?"#16823b":(n<=20?"#c99a00":"#c51624");
}
mins.addEventListener("input",updateDelay);
function msg(){
 const d=date.value.split("-").reverse().join(" ");
 const n=Math.max(0,Number(mins.value)||0);
 const c=cause.value==="Other"?other.value:cause.value;
 return `Delay of ${n} minutes
Date: ${d}
Headcode: ${head.value}
Location: ${loc.value}
Cause: ${c}
Control desk aware: ${control.value}`+
 (notes.value.trim()?`
Any other information: ${notes.value.trim()}`:"");
}
function emailMsg(){
 const n=Math.max(0,Number(mins.value)||0);
 location.href="mailto:?subject="+encodeURIComponent("Delay of "+n+" minutes - "+head.value)+"&body="+encodeURIComponent(msg());
}
updateDelay();</script><script>
function xcGeneratePDF(title){
 const lines=[title,"","XC STAFF APP",""];
 document.querySelectorAll("input,select,textarea").forEach(el=>{
  if(el.value){const l=el.closest(".field")?.querySelector("label")?.innerText||el.name||el.id||"Entry";lines.push(l+": "+el.value)}
 });
 const esc=v=>String(v).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").replace(/\r?\n/g," ");
 const W=595,H=842,m=42,lead=14,pages=[[]];let y=H-m;
 lines.forEach(x=>{if(y<55){pages.push([]);y=H-m}pages.at(-1).push(x);y-=lead});
 let o=[],add=x=>(o.push(x),o.length),po=add(""),fo=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"),refs=[];
 pages.forEach(ls=>{let c="BT /F1 10 Tf "+m+" "+(H-m)+" Td ";ls.forEach((x,i)=>{if(i)c+=" 0 -14 Td ";c+="("+esc(x)+") Tj "});c+=" ET";let st=add("<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream");refs.push(add("<< /Type /Page /Parent "+po+" 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /Font << /F1 "+fo+" 0 R >> >> /Contents "+st+" 0 R >>"))});
 o[po-1]="<< /Type /Pages /Count "+refs.length+" /Kids ["+refs.map(x=>x+" 0 R").join(" ")+"] >>";
 let cat=add("<< /Type /Catalog /Pages "+po+" 0 R >>"),pdf="%PDF-1.4\n",off=[0];
 o.forEach((x,i)=>{off.push(pdf.length);pdf+=(i+1)+" 0 obj\n"+x+"\nendobj\n"});
 let xr=pdf.length;pdf+="xref\n0 "+(o.length+1)+"\n0000000000 65535 f \n";for(let i=1;i<off.length;i++)pdf+=String(off[i]).padStart(10,"0")+" 00000 n \n";
 pdf+="trailer\n<< /Size "+(o.length+1)+" /Root "+cat+" 0 R >>\nstartxref\n"+xr+"\n%%EOF";
 let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([pdf],{type:"application/pdf"}));a.download=title.replace(/[^a-z0-9]+/gi,"-")+".pdf";a.click();
}
</script><script id="xc-button-safety">

<script id="xc-standard-actions-v104">
(function(){
 function callFirst(names, evt){
   for(const n of names){
     if(typeof window[n]==="function"){ try{ window[n](evt); return true; }catch(e){ console.error(e); } }
   }
   return false;
 }
 document.addEventListener("click",function(e){
   const b=e.target.closest("button");
   if(!b)return;
   const id=(b.id||"").toLowerCase();
   const text=(b.textContent||"").trim().toLowerCase();
   if(id==="copy"||id==="copybtn"||text==="copy"||text.includes("copy")){
     if(callFirst(["copyReport","copyData","copyCounts","copyAll","copyToClipboard","copyForm"],e)) return;
   }
   if(id==="email"||id==="emailbtn"||text.includes("email")){
     if(callFirst(["emailReport","emailData","emailCounts","emailAll","sendEmail","emailForm"],e)) return;
   }
   if(id==="pdf"||id==="pdfbtn"||text.includes("generate pdf")||text.includes("export pdf")||text.includes("save pdf")){
     if(callFirst(["generateIncidentPDF","generatePDF","exportPDF","savePDF","generatePdf","exportPdf"],e)) return;
   }
   if(id==="clear"||id==="clearbtn"||text==="clear"||text.includes("clear all")){
     if(callFirst(["clearForm","clearAll","clearNotes","clearData","clearCounts","resetForm"],e)) return;
   }
 });
})();
</script><script>function printPDF(){window.print();}</script><script id="xc-shared-pdf-engine-v115">function generatePDF(){
