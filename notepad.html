<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="#b5121b" name="theme-color"/>
<title>Notepad - XC Staff App</title>
<style>
*{box-sizing:border-box}
html{background:#b5121b}
body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f3f3;color:#222}
.header{background:#b5121b;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
.header img{width:145px;height:32px;object-fit:contain}.title{font-weight:800;font-size:19px;margin-left:auto}
main{max-width:700px;margin:auto;padding:14px}
.main-menu{display:block;text-align:center;text-decoration:none;background:#b5121b;color:#fff;border-radius:10px;padding:12px 14px;font-weight:800;margin-bottom:12px}
.tip{background:#fff;border-left:4px solid #b5121b;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
button{appearance:none;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:800;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.add{background:#b5121b;color:#fff}.save,.pdf,.clear{background:#fff;color:#b5121b;border:1px solid #b5121b}
.note{background:#fff;border-radius:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden}
.note-head{display:flex;align-items:center;gap:8px;padding:12px}
.toggle{flex:0 0 40px;width:40px;height:40px;padding:0;background:#b5121b;color:#fff;font-size:23px}
.note-title{flex:1;min-width:0;padding:10px;border:1px solid #ccc;border-radius:9px;font:inherit;font-weight:800}
.note-title:disabled{background:#f7f7f7;border-color:#eee;color:#222}
.note-body{padding:0 12px 12px}.time{font-size:12px;color:#777;font-weight:700;margin:0 0 8px}
.note-body textarea{display:block;width:100%;min-height:120px;resize:vertical;padding:11px;border:1px solid #ccc;border-radius:9px;font:inherit}
.note-body textarea.new-note-line{min-height:42px;height:42px}.note-body textarea:disabled{background:#f7f7f7;border-color:#eee;color:#222}
.note-actions{display:flex;gap:8px;margin-top:9px}.note-actions button{flex:1}
.edit{background:#eee;color:#333}.delete{background:#fff;color:#b5121b;border:1px solid #b5121b}
.collapsed .note-body{display:none}
.status{text-align:center;min-height:20px;font-size:13px;color:#555;margin:6px 0 12px}
.empty{background:#fff;border-radius:12px;padding:20px;text-align:center;color:#666}
@media(max-width:520px){.toolbar{grid-template-columns:1fr}.note-actions{flex-direction:column}}
</style>
<style id="xc-safe-area">
html{background:#b5121b}
body{
padding-top:env(safe-area-inset-top);
padding-right:env(safe-area-inset-right);
padding-bottom:env(safe-area-inset-bottom);
padding-left:env(safe-area-inset-left);
}
@supports(padding:max(0px)){
body{
padding-top:max(12px,env(safe-area-inset-top));
padding-right:max(0px,env(safe-area-inset-right));
padding-bottom:max(12px,env(safe-area-inset-bottom));
padding-left:max(0px,env(safe-area-inset-left));
}
}
</style><style id="xc-header-logo">
.xc-page-header-logo{width:86px;height:24px;object-fit:contain;display:block;flex:0 0 auto}
</style><style id="xc-single-header-logo">
.xc-page-header-logo{width:86px;height:24px;object-fit:contain;display:block;flex:0 0 auto}
</style><style id="xc-uniform-inputs">
/* XC uniform form controls */
input[type="text"],input[type="number"],input[type="date"],input[type="time"],
input[type="email"],input[type="tel"],input[type="search"],input[type="url"],
input:not([type]),select,textarea{
  width:100%;
  min-height:44px;
  height:44px;
  box-sizing:border-box;
  padding:10px 11px;
  border:1px solid #bbb;
  border-radius:9px;
  font:inherit;
  line-height:1.25;
  background:#fff;
}
textarea{
  height:120px;
  min-height:120px;
  resize:vertical;
}
</style><style id="xc-print-style">
@media print{
 body{background:#fff!important}
 .actions,button,a.menu,.no-print{display:none!important}
 .app,.container,main{max-width:none!important;box-shadow:none!important}
 .card{break-inside:avoid}
 @page{size:A4;margin:14mm}
}
</style><style id="xc-pdf-print-style">
@media print{
  body{background:#fff!important;color:#111!important}
  .no-print,.actions,button,a.menu{display:none!important}
  header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  main{max-width:none!important;margin:0!important;padding:0!important}
  .card{box-shadow:none!important;break-inside:avoid}
  input,select,textarea{border:0!important;background:#fff!important;padding:2px 0!important}
  @page{size:A4;margin:14mm}
}
</style><style id="xc-shared-pdf-engine-v115">
@media print{
 body{background:#fff!important;color:#111!important}
 .no-print,.actions,button,a.menu{display:none!important}
 header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 main{max-width:none!important;margin:0!important;padding:0!important}
 .card{box-shadow:none!important;break-inside:avoid}
 @page{size:A4;margin:14mm}
}
</style><link href="xc.css" rel="stylesheet"/></head>
<body>
<header class="header"><img alt="XC" class="xc-page-header-logo" src="crosscountry-logo-white.png"/><div class="title">Notepad</div></header>
<main>
<a class="main-menu" href="index.html">← Main menu</a>
<div class="tip">💡 <strong>This is for on the day notes / messages</strong></div>
<div class="toolbar">
<button class="add" id="addBtn" type="button">＋ Add Note</button>
<button class="save" id="saveBtn" type="button">💾 Save Locally</button>

<button class="clear" id="clearBtn" type="button">🗑 Clear All</button>
</div>
<div class="status" id="status"></div>
<div id="notes"></div>
</main>
<script>
(function(){
"use strict";
const KEY="xc_staff_app_notepad_v4";
let notes=[];

function stamp(){
 const d=new Date();
 const dd=String(d.getDate()).padStart(2,"0");
 const mm=String(d.getMonth()+1).padStart(2,"0");
 const yyyy=d.getFullYear();
 const hh=String(d.getHours()).padStart(2,"0");
 const mi=String(d.getMinutes()).padStart(2,"0");
 return dd+"/"+mm+"/"+yyyy+" "+hh+":"+mi;
}
function esc(v){
 return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function show(msg){
 const el=document.getElementById("status");
 el.textContent=msg;
 clearTimeout(show.t);
 show.t=setTimeout(function(){el.textContent="";},2500);
}
function persist(){localStorage.setItem(KEY,JSON.stringify(notes));}

function render(){
 const box=document.getElementById("notes");
 if(!notes.length){
   box.innerHTML='<div class="empty">No notes yet. Press <strong>＋ Add Note</strong> to create one.</div>';
   return;
 }
 box.innerHTML=notes.map(function(n,i){
   return '<div class="note '+(n.collapsed?"collapsed":"")+'">'+
    '<div class="note-head">'+
    '<button type="button" class="toggle" data-action="toggle" data-i="'+i+'">'+(n.collapsed?"＋":"−")+'</button>'+
    '<input class="note-title" id="title-'+i+'" value="'+esc(n.title)+'" placeholder="Title" '+(n.editing?"":"disabled")+'>'+
    '</div>'+
    '<div class="note-body">'+
    '<div class="time">Created '+esc(n.time)+'</div>'+
    '<textarea id="text-'+i+'" placeholder="Note" '+(n.editing?"":"disabled")+'>'+esc(n.text)+'</textarea>'+
    '<div class="note-actions">'+
    (n.editing?'<button type="button" class="save" data-action="save" data-i="'+i+'">💾 Save &amp; close</button>':
                 '<button type="button" class="edit" data-action="edit" data-i="'+i+'">✏️ Edit note</button>')+
    '<button type="button" class="delete" data-action="delete" data-i="'+i+'">🗑 Delete</button>'+
    '</div></div></div>';
 }).join("");
}

function addNote(){
 notes.push({time:stamp(),title:"",text:"",collapsed:false,editing:true,newLine:true});
 persist();render();
 const el=document.getElementById("title-"+(notes.length-1));
 if(el){el.focus();}
}
function read(i){
 const t=document.getElementById("title-"+i);
 const b=document.getElementById("text-"+i);
 if(t)notes[i].title=t.value;
 if(b)notes[i].text=b.value;
}
function saveNote(i){
 read(i);notes[i].editing=false;persist();render();show("Note saved and editing closed.");
}
function editNote(i){notes[i].editing=true;notes[i].collapsed=false;notes[i].newLine=false;render();const el=document.getElementById("text-"+i);if(el)el.focus();}
function toggleNote(i){if(notes[i].editing)read(i);notes[i].collapsed=!notes[i].collapsed;persist();render();}
function deleteNote(i){
 if(!confirm("Are you sure you want to delete this note?"))return;
 notes.splice(i,1);persist();render();show("Note deleted.");
}
function saveAll(){
 notes.forEach(function(n,i){if(n.editing)read(i);n.editing=false;n.newLine=false;});
 persist();render();show("Notes saved locally.");
}
function clearAll(){
 if(!confirm("Are you sure? This will clear all notes."))return;
 notes=[];localStorage.removeItem(KEY);render();show("All notes cleared.");
}

document.getElementById("addBtn").addEventListener("click",addNote);
document.getElementById("saveBtn").addEventListener("click",saveAll);
document.getElementById("clearBtn").addEventListener("click",clearAll);
document.getElementById("notes").addEventListener("click",function(e){
 const b=e.target.closest("button[data-action]");if(!b)return;
 const i=Number(b.dataset.i),a=b.dataset.action;
 if(a==="toggle")toggleNote(i);
 if(a==="save")saveNote(i);
 if(a==="edit")editNote(i);
 if(a==="delete")deleteNote(i);
});
try{
 const stored=JSON.parse(localStorage.getItem(KEY)||"[]");
 notes=Array.isArray(stored)?stored.map(function(n){return {time:n.time||stamp(),title:n.title||"",text:n.text||"",collapsed:!!n.collapsed,editing:false};}):[];
}catch(e){notes=[];}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
<script id="xc-button-safety">
document.addEventListener("click",function(e){
 const b=e.target.closest("button[data-action]");
 if(!b)return;
 const fn=b.dataset.action;
 if(typeof window[fn]==="function")window[fn](e);
});
</script>
<script id="xc-standard-actions-v104">
(function(){
 function callFirst(names, evt){
   for(const n of names){
     if(typeof window[n]==="function"){ try{ window[n](evt); return true; }catch(e){ console.error(e); } }
   }
   return false;
 }
 document.addEventListener("click",function(e){
   const b=e.target.closest("button");
   if(!b)return;
   const id=(b.id||"").toLowerCase();
   const text=(b.textContent||"").trim().toLowerCase();
   if(id==="copy"||id==="copybtn"||text==="copy"||text.includes("copy")){
     if(callFirst(["copyReport","copyData","copyCounts","copyAll","copyToClipboard","copyForm"],e)) return;
   }
   if(id==="email"||id==="emailbtn"||text.includes("email")){
     if(callFirst(["emailReport","emailData","emailCounts","emailAll","sendEmail","emailForm"],e)) return;
   }
   if(id==="clear"||id==="clearbtn"||text==="clear"||text.includes("clear all")){
     if(callFirst(["clearForm","clearAll","clearNotes","clearData","clearCounts","resetForm"],e)) return;
   }
 });
})();
</script><script id="xc-button-repair-v118">
document.addEventListener("click",function(e){
 const b=e.target.closest("button[data-action]");
 if(!b)return;
 const fn=b.dataset.action;
 if(typeof window[fn]==="function"){e.preventDefault();window[fn](e);}
});
</script><script src="xc-common.js"></script></body>
</html>
