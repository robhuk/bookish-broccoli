<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7"><title>Notes - XC Staff App</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f2f2f7;color:#1c1c1e;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}.nav{height:58px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #e5e5ea;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);z-index:5}.back{color:#007aff;text-decoration:none;font-size:17px}.nav h1{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;margin:0}.add{margin-left:auto;border:0;background:none;color:#007aff;font-size:30px;line-height:1;cursor:pointer}.search{margin:12px 14px;padding:9px 12px;background:#e9e9eb;border-radius:10px;display:flex;gap:8px;align-items:center}.search input{border:0;background:transparent;outline:0;width:100%;font:inherit;font-size:16px}.list{padding:0 14px 90px}.note{border-bottom:1px solid #e5e5ea;padding:14px 2px;cursor:pointer}.note h2{font-size:17px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note .date{font-size:13px;color:#8e8e93}.note .preview{font-size:15px;color:#3a3a3c;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:#8e8e93;text-align:center;padding:70px 20px}.composer{display:none;position:fixed;inset:0;background:#fff;z-index:20;max-width:760px;margin:auto}.composer.open{display:block}.editor-nav{height:58px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #e5e5ea}.done{margin-left:auto;color:#007aff;background:none;border:0;font:inherit;font-size:17px;font-weight:600}.delete{background:none;border:0;color:#ff3b30;font-size:24px}.created{padding:12px 16px 0;text-align:center;font-size:13px;color:#8e8e93}.title{display:block;width:100%;border:0;outline:0;padding:14px 16px 6px;font-size:24px;font-weight:700;font-family:inherit}.body{width:100%;height:calc(100vh - 180px);border:0;outline:0;resize:none;padding:6px 16px 30px;font:18px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.floating{position:fixed;right:22px;bottom:24px;width:56px;height:56px;border:0;border-radius:50%;background:#007aff;color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
</style></head><body><div class="app"><div class="nav"><a class="back" href="index.html">‹ Menu</a><h1>Notes</h1><button class="add" onclick="newNote()">✎</button></div><div class="search">⌕ <input id="search" placeholder="Search" oninput="render()"></div><div id="list" class="list"></div><button class="floating" onclick="newNote()">✎</button></div>
<div id="composer" class="composer"><div class="editor-nav"><button class="back" onclick="closeEditor()">‹ Notes</button><button class="delete" onclick="deleteCurrent()">🗑</button><button class="done" onclick="saveCurrent()">Done</button></div><div id="created" class="created"></div><input id="title" class="title" placeholder="Title"><textarea id="body" class="body" placeholder="Start writing..."></textarea></div>
<script>
const KEY='xc_native_notes_v1';let notes=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null;
const fmt=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function render(){const q=document.getElementById('search').value.toLowerCase(),el=document.getElementById('list');const filtered=notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q));el.innerHTML=filtered.length?filtered.map(n=>`<div class="note" onclick="openNote('${n.id}')"><h2>${esc(n.title||'New Note')}</h2><div class="date">${fmt(n.created)}</div><div class="preview">${esc(n.body)}</div></div>`).join(''):'<div class="empty">No Notes</div>'}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newNote(){current={id:crypto.randomUUID(),title:'',body:'',created:new Date().toISOString()};showEditor()}
function openNote(id){current=notes.find(n=>n.id===id);showEditor()}
function showEditor(){document.getElementById('title').value=current.title;document.getElementById('body').value=current.body;document.getElementById('created').textContent='Created '+fmt(current.created);document.getElementById('composer').classList.add('open');setTimeout(()=>document.getElementById('title').focus(),100)}
function closeEditor(){document.getElementById('composer').classList.remove('open');current=null;render()}
function saveCurrent(){current.title=document.getElementById('title').value.trim();current.body=document.getElementById('body').value;const i=notes.findIndex(n=>n.id===current.id);if(i<0)notes.unshift(current);else notes[i]=current;localStorage.setItem(KEY,JSON.stringify(notes));closeEditor()}
function deleteCurrent(){if(!current)return;if(confirm('Are you sure you want to delete this note?')){notes=notes.filter(n=>n.id!==current.id);localStorage.setItem(KEY,JSON.stringify(notes));closeEditor()}}
render();
</script></body></html>
