<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7"><title>Notes | CrossCountry Crew Toolkit</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f2f2f7;color:#1c1c1e;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}.nav{height:58px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #e5e5ea;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);z-index:5}.back{color:#007aff;text-decoration:none;font-size:17px}.nav h1{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;margin:0}.add{margin-left:auto;border:0;background:none;color:#007aff;font-size:30px;line-height:1;cursor:pointer}.search{margin:12px 14px;padding:9px 12px;background:#e9e9eb;border-radius:10px;display:flex;gap:8px;align-items:center}.search input{border:0;background:transparent;outline:0;width:100%;font:inherit;font-size:16px}.list{padding:0 14px 90px}.note{border-bottom:1px solid #e5e5ea;padding:14px 2px;cursor:pointer}.note h2{font-size:17px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note .date{font-size:13px;color:#8e8e93}.note .preview{font-size:15px;color:#3a3a3c;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:#8e8e93;text-align:center;padding:70px 20px}.composer{display:none;position:fixed;inset:0;background:#fff;z-index:20;max-width:760px;margin:auto}.composer.open{display:block}.editor-nav{height:58px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #e5e5ea}.done{margin-left:auto;color:#007aff;background:none;border:0;font:inherit;font-size:17px;font-weight:600}.delete{background:none;border:0;color:#ff3b30;font-size:24px}.created{padding:12px 16px 0;text-align:center;font-size:13px;color:#8e8e93}.title{display:block;width:100%;border:0;outline:0;padding:14px 16px 6px;font-size:24px;font-weight:700;font-family:inherit}.body{width:100%;height:calc(100vh - 180px);border:0;outline:0;resize:none;padding:6px 16px 30px;font:18px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.floating{position:fixed;right:22px;bottom:24px;width:56px;height:56px;border:0;border-radius:50%;background:#007aff;color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
</style><style>body{background:#f3f3f3!important;color:#222!important}.xc-notes-header,.notes-header,header{background:#b5121b!important;color:#fff!important}.note-card,.note-item,.editor,.note-editor{border-radius:12px!important;border:1px solid #ddd!important;box-shadow:0 2px 8px rgba(0,0,0,.08)!important}.new-note,.fab,button.primary{background:#b5121b!important;color:#fff!important}button{border-radius:10px!important}.search-wrap input,.search input{border:1px solid #ccc!important;border-radius:10px!important}</style>
<style id="globalPageDataControls">
.global-page-data-controls{position:fixed;top:12px;right:12px;z-index:99999;display:flex;gap:8px}.global-page-data-controls button{width:42px;height:42px;border:0;border-radius:12px;background:#fff;color:#d10a4b;box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:20px;cursor:pointer}.global-page-data-controls button:hover{transform:translateY(-1px)}@media print{.global-page-data-controls{display:none!important}}
</style>

<style>
.action-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  width:100%;
  padding:12px 0 10px;
  box-sizing:border-box;
  clear:both;
}
.action-row .page-actions,.action-row .header-actions,.action-row .top-actions,.action-row .toolbar-actions{
  position:static!important;
  right:auto!important; left:auto!important; top:auto!important;
  display:flex!important; justify-content:center!important; gap:14px!important;
}
@media print{.print-hide,.action-row{display:none!important}}
</style>

<style id="xc-uniform-theme">
:root{
  --xc-magenta:#b0004f;
  --xc-magenta-dark:#85003b;
  --xc-grey:#f3f3f3;
  --xc-text:#222;
}
body{background:var(--xc-grey)!important;color:var(--xc-text)!important;font-family:Arial,Helvetica,sans-serif!important;margin:0!important;}
header,.app-header,.page-header{
  background:linear-gradient(135deg,var(--xc-magenta),var(--xc-magenta-dark))!important;
  color:#fff!important;
  padding:16px 18px!important;
  box-shadow:0 2px 8px rgba(0,0,0,.16)!important;
}
header h1,.app-header h1,.page-header h1,
header h2,.app-header h2,.page-header h2{color:#fff!important;margin:0!important;font-size:1.05rem!important;}
main,.container,.content{max-width:920px;margin:0 auto;padding:18px!important;box-sizing:border-box;}
.card,.section,.note-card,.link-card,.note-item{
  background:#fff!important;border:1px solid #ddd!important;border-radius:14px!important;
  box-shadow:0 2px 7px rgba(0,0,0,.08)!important;
}
h2,h3{color:var(--xc-magenta-dark)!important;}
button,.button,.btn{
  background:var(--xc-magenta)!important;color:#fff!important;border:0!important;
  border-radius:10px!important;padding:12px 16px!important;font-weight:700!important;
}
button:hover,.button:hover,.btn:hover{background:var(--xc-magenta-dark)!important;}
input,textarea,select{
  border:1px solid #c8c8c8!important;border-radius:9px!important;
  background:#fff!important;color:#222!important;
}
textarea:focus,input:focus,select:focus{outline:2px solid rgba(176,0,79,.25)!important;border-color:var(--xc-magenta)!important;}
footer{font-size:.72rem!important;text-align:center!important;color:#777!important;padding:18px!important;}
</style>
</head><body><div class="app"><div class="nav"><a class="back" href="index.html">‹ Menu</a><h1>📝 Notes</h1><button class="add" onclick="newNote()">✎</button></div><div class="search">⌕ <input id="search" placeholder="Search" oninput="render()"></div><div id="list" class="list"></div><button class="floating" onclick="newNote()">✎</button></div>
<div id="composer" class="composer"><div class="editor-nav"><button class="back" onclick="closeEditor()">‹ Notes</button><button class="delete" onclick="deleteCurrent()">🗑</button><button class="done" onclick="saveCurrent()">Done</button></div><div id="created" class="created"></div><input id="title" class="title" placeholder="Title"><textarea id="body" class="body" placeholder="Start writing..."></textarea></div>
<script>
const KEY='xc_native_notes_v1';let notes=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null;
const fmt=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function render(){const q=document.getElementById('search').value.toLowerCase(),el=document.getElementById('list');const filtered=notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q));el.innerHTML=filtered.length?filtered.map(n=>`<div class="note" onclick="openNote('${n.id}')"><h2>${esc(n.title||'New Note')}</h2><div class="date">${fmt(n.created)}</div><div class="preview">${esc(n.body)}</div></div>`).join(''):'<div class="empty">No Notes</div>'}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newNote(){current={id:crypto.randomUUID(),title:'',body:'',created:new Date().toISOString()};showEditor()}
function openNote(id){current=notes.find(n=>n.id===id);showEditor()}
function showEditor(){document.getElementById('title').value=current.title;document.getElementById('body').value=current.body;document.getElementById('created').textContent='Created '+fmt(current.created);document.getElementById('composer').classList.add('open');setTimeout(()=>document.getElementById('title').focus(),100)}
function closeEditor(){document.getElementById('composer').classList.remove('open');current=null;render()}
function saveCurrent(){current.title=document.getElementById('title').value.trim();current.body=document.getElementById('body').value;const i=notes.findIndex(n=>n.id===current.id);if(i<0)notes.unshift(current);else notes[i]=current;localStorage.setItem(KEY,JSON.stringify(notes));closeEditor()}
function deleteCurrent(){if(!current)return;if(confirm('Are you sure you want to delete this note?')){notes=notes.filter(n=>n.id!==current.id);localStorage.setItem(KEY,JSON.stringify(notes));closeEditor()}}
render();
</script>
<script>
(function(){
  const key='xc_page_data_'+location.pathname.split('/').pop();
  function fields(){return [...document.querySelectorAll('input,textarea,select')].filter(e=>e.type!=='button'&&e.type!=='submit'&&e.type!=='reset');}
  function save(){const data={};fields().forEach((e,i)=>{const k=e.id||e.name||('field_'+i);data[k]={v:e.type==='checkbox'?e.checked:e.value,t:e.type};});localStorage.setItem(key,JSON.stringify(data));alert('Data saved.');}
  function clear(){if(!confirm('Are you sure you want to clear all data on this page?'))return;fields().forEach(e=>{if(e.type==='checkbox'||e.type==='radio')e.checked=false;else if(e.type!=='hidden')e.value='';e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));});localStorage.removeItem(key);}
  function restore(){try{const data=JSON.parse(localStorage.getItem(key)||'{}');fields().forEach((e,i)=>{const k=e.id||e.name||('field_'+i),d=data[k];if(!d)return;if(e.type==='checkbox')e.checked=!!d.v;else e.value=d.v;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));});}catch(_){}}
  document.addEventListener('DOMContentLoaded',()=>{
    const bar=document.createElement('div');bar.className='global-page-data-controls';bar.innerHTML='<button type="button" aria-label="Save data" title="Save data">💾</button><button type="button" aria-label="Clear data" title="Clear data">🗑️</button>';document.body.appendChild(bar);
    bar.children[0].addEventListener('click',save);bar.children[1].addEventListener('click',clear);restore();
  });
})();
</script>
</body></html>
