<header><a class="back" href="index.html">‹ Back to Staff App</a><div class="heading">⏰ ⏰ Book Off Late (Late Running)</div></header><div class="main-menu-wrap"></div><main><a class="xc-main-menu" href="index.html">← Main menu</a><div class="card">
<div class="grid">
<div class="field"><label>Date</label><input data-report-label="Date of incident" id="date" type="date"/></div><div class="field"><label>Job Number</label><input id="job" placeholder="Job number"/></div>
<div class="field"><label>Headcode</label><input id="head" placeholder="e.g. 1V50"/></div>
<div class="field"><label>Original Book Of Time</label><input id="orig" type="time"/></div><div class="field"><label>Delay Minutes</label><input id="mins" inputmode="numeric" min="0" placeholder="Minutes" type="number"/></div>
</div></div>
<div class="card">
<label>Reason</label>
<select id="cause">
<option>Other</option>
<option>Passenger-related</option>
<option>Train crew / staffing</option>
<option>Train fault / technical</option>
<option>Signalling</option>
<option>Points / route setting</option>
<option>Infrastructure</option>
<option>External / trespass</option>
<option>Weather</option>
<option>Congestion / regulation</option>
</select>
<div class="field" style="margin-top:12px">
<input id="other" placeholder="If Other, enter reason"/>
</div>
</div>
<div class="card">
<label>Any other information</label>
<textarea data-report-label="Any additional notes or information" id="notes" placeholder="Optional notes"></textarea>
</div>
<div class="card">
<div class="actions"></div>
<div class="status" id="status"></div>
</div></main><script>
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);

function toggleOther(){
  const isOther=$("cause").value==="Other - Please Specify";
  $("otherWrap").style.display=isOther?"block":"none";
  if(!isOther) $("other").value="";
}

function reasonText(){
  return $("cause").value==="Other - Please Specify"
    ? $("other").value.trim()
    : $("cause").value;
}

function getDate(){
  const v=$("date").value;
  if(!v) return "";
  const [y,m,d]=v.split("-");
  return d+" "+m+" "+y;
}

function newBookOffTime(){
  const original=$("orig").value;
  const delay=parseInt($("mins").value,10);
  if(!original || Number.isNaN(delay)) return "";
  const [h,m]=original.split(":").map(Number);
  let total=h*60+m+Math.max(0,delay);
  total=((total%1440)+1440)%1440;
  return String(Math.floor(total/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0");
}

function buildMessage(){
  const date=getDate(); const job=$("job").value.trim(); const head=$("head").value.trim();
  const delay=Math.max(0,parseInt($("mins").value,10)||0); const reason=reasonText();
  const newTime=newBookOffTime(); const comments=$("notes").value.trim();
  const subject=`Late Book Off from ${head} - ${job} - ${delay} Minutes Late`;
  let body=`Hello,\n\nDue to the late running of ${head}, please book me off ${job} ${delay} minutes late due to ${reason}.`;
  if(comments) body+=`\n\n${comments}`;
  body+=`\n\nMy new book off time is ${newTime}. Please book me off at this time.\n\nThanks`;
  return {subject,body};
}
function validate(){
  const checks=[
    ["date","Date"],["job","Job Number"],["head","Headcode"],["orig","Original Book Off Time"]
  ];
  for(const [id,label] of checks){
    if(!$(""+id) || !$(id).value){
      $("status").textContent="Please complete "+label+".";
      return false;
    }
  }
  if($("mins").value===""){
    $("status").textContent="Please enter Delay in Minutes.";
    return false;
  }
  if($("cause").value==="Other - Please Specify" && !$("other").value.trim()){
    $("status").textContent="Please specify the reason.";
    return false;
  }
  return true;
}

async function copyMessage(){
  if(!validate()) return;
  const m=buildMessage();
  const text="Subject: "+m.subject+"\n\n"+m.body;
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand("copy");}catch(err){
      $("status").textContent="Unable to copy. Please use Generate Message.";
      ta.remove();return;
    }
    ta.remove();
  }
  $("status").textContent="Message copied to clipboard.";
}

function emailMsg(){
  if(!validate()) return;
  const m=buildMessage();
  window.location.href="mailto:?subject="+encodeURIComponent(m.subject)+"&body="+encodeURIComponent(m.body);
}

toggleOther();
</script><script>

 o[po-1]="<< /Type /Pages /Count "+refs.length+" /Kids ["+refs.map(x=>x+" 0 R").join(" ")+"] >>";
 let cat=add("<< /Type /Catalog /Pages "+po+" 0 R >>"),pdf="%PDF-1.4\n",off=[0];

 pdf+="trailer\n<< /Size "+(o.length+1)+" /Root "+cat+" 0 R >>\nstartxref\n"+xr+"\n%%EOF";

<script id="xc-standard-actions-v104">
(function(){
 function callFirst(names, evt){
   for(const n of names){
     if(typeof window[n]==="function"){ try{ window[n](evt); return true; }catch(e){ console.error(e); } }
   }
   return false;
 }
 document.addEventListener("click",function(e){
   const b=e.target.closest("button");
   if(!b)return;
   const id=(b.id||"").toLowerCase();
   const text=(b.textContent||"").trim().toLowerCase();
   if(id==="copy"||id==="copybtn"||text==="copy"||text.includes("copy")){
     if(callFirst(["copyReport","copyData","copyCounts","copyAll","copyToClipboard","copyForm"],e)) return;
   }
   if(id==="email"||id==="emailbtn"||text.includes("email")){
     if(callFirst(["emailReport","emailData","emailCounts","emailAll","sendEmail","emailForm"],e)) return;
   }
   if(id==="pdf"||id==="pdfbtn"||text.includes("generate pdf")||text.includes("export pdf")||text.includes("save pdf")){
     if(callFirst(["generateIncidentPDF","generatePDF","exportPDF","savePDF","generatePdf","exportPdf"],e)) return;
   }
   if(id==="clear"||id==="clearbtn"||text==="clear"||text.includes("clear all")){
     if(callFirst(["clearForm","clearAll","clearNotes","clearData","clearCounts","resetForm"],e)) return;
   }
 });
})();
</script><script id="xc-button-repair-v118">
document.addEventListener("click",function(e){

<script>
(function(){
  const key='xc_page_data_'+location.pathname.split('/').pop();
  function fields(){return [...document.querySelectorAll('input,textarea,select')].filter(e=>e.type!=='button'&&e.type!=='submit'&&e.type!=='reset');}
  function save(){const data={};fields().forEach((e,i)=>{const k=e.id||e.name||('field_'+i);data[k]={v:e.type==='checkbox'?e.checked:e.value,t:e.type};});localStorage.setItem(key,JSON.stringify(data));alert('Data saved.');}
  function clear(){if(!confirm('Are you sure you want to clear all data on this page?'))return;fields().forEach(e=>{if(e.type==='checkbox'||e.type==='radio')e.checked=false;else if(e.type!=='hidden')e.value='';e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));});localStorage.removeItem(key);}
  function restore(){try{const data=JSON.parse(localStorage.getItem(key)||'{}');fields().forEach((e,i)=>{const k=e.id||e.name||('field_'+i),d=data[k];if(!d)return;if(e.type==='checkbox')e.checked=!!d.v;else e.value=d.v;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));});}catch(_){}}
  document.addEventListener('DOMContentLoaded',()=>{
    const bar=document.createElement('div');bar.className='global-page-data-controls';bar.innerHTML='<button type="button" aria-label="Save data" title="Save data">💾</button><button type="button" aria-label="Clear data" title="Clear data">🗑️</button>';document.body.appendChild(bar);
    bar.children[0].addEventListener('click',save);bar.children[1].addEventListener('click',clear);restore();
  });
})();
</script>

<script id="humanReadableReportTextV152">
(function(){
  function tidyText(text){
    return String(text||"")
      .replace(/[ \t]+\n/g,"\n")
      .replace(/\n{3,}/g,"\n\n")
      .replace(/ +([,.;:!?])/g,"$1")
      .replace(/\bhello,\s*/i,"Hello,\n\n")
      .replace(/\bthanks\s*$/i,"Thanks")
      .trim();
  }
  document.addEventListener("DOMContentLoaded",function(){
    // Apply only to generated report/email previews, not user input fields.
    document.querySelectorAll("#generatedReport,#generatedEmail,#output,#emailPreview,.generated-report,.email-preview,.report-output").forEach(function(el){
      if(el.matches("textarea,input")) return;
      var original=el.textContent;
      if(original && original.trim()) el.textContent=tidyText(original);
    });
  });
})();
</script>





<script id="xc-form-email-fields-v165">
(function(){
 function clean(v){return String(v==null?"":v).trim();}
 function labelFor(el){
   if(el.labels&&el.labels.length)return clean(el.labels[0].innerText).replace(/[:*]\s*$/,"");
   if(el.id){const l=document.querySelector('label[for="'+el.id+'"]');if(l)return clean(l.innerText).replace(/[:*]\s*$/,"");}
   const wrap=el.closest(".field,.form-group,.input-group,.row,div");
   const l=wrap&&wrap.querySelector("label");
   return clean(l?l.innerText:(el.getAttribute("aria-label")||el.placeholder||el.name||el.id||"Information")).replace(/[:*]\s*$/,"");
 }
 window.xcFormFieldDataV165=function(){
   const out=[];
   document.querySelectorAll("input,textarea,select").forEach(el=>{
     if(el.disabled||el.type==="hidden"||/^(button|submit|reset)$/i.test(el.type))return;
     if((el.type==="checkbox"||el.type==="radio")&&!el.checked)return;
     let v=el.tagName==="SELECT"?clean(el.options[el.selectedIndex]?.text||el.value):clean(el.value);
     if(el.type==="checkbox")v=el.checked?"Yes":"No";
     if(v)out.push({label:labelFor(el),value:v});
   });
   return out;
 };
 window.xcFormFieldsAsTextV165=function(){
   return window.xcFormFieldDataV165().map(x=>x.label+": "+x.value).join("\n");
 };
})();
