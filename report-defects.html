</div>

  <div class="field"><label>Headcode</label><input id="defect-headcode" placeholder="e.g. 1V50"></div><div class="field"><label>Unit (six digits)</label><input id="shared-unit" type="text" inputmode="numeric" maxlength="6" placeholder="Unit" value="" oninput="updateSharedUnit(this.value)"></div>
  <div class="hint">This Unit number will be used for all entered defects.</div>
</div>

<div class="status" id="status"></div>
</div>

<script>
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
let defects=[];
let sharedUnit="";

function addDefect(){
  defects.push({pvn:"",defect:""});
  renderDefects();
  setTimeout(()=>{
    const cards=document.querySelectorAll(".defect-entry");
    cards[cards.length-1]?.querySelector(".pvn")?.focus();
  },0);
}

function updateDefect(i,key,value){defects[i][key]=value}
function updateSharedUnit(value){sharedUnit=value;}

function renderDefects(){
  const box=document.getElementById("defects");
  box.innerHTML=defects.map((d,i)=>`
    <div class="card defect-entry">
      <h3>Defect ${i+1}</h3>
      <div class="field"><label>PVN (six digits)</label><input class="pvn" type="text" inputmode="numeric" maxlength="6" placeholder="PVN" value="${esc(d.pvn)}" oninput="updateDefect(${i},'pvn',this.value)"></div>
      <div class="field"><label>Defect</label><textarea placeholder="Describe the defect" oninput="updateDefect(${i},'defect',this.value)">${esc(d.defect)}</textarea></div>
    </div>`).join("");
}

function esc(v){
  return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function validate(){
  if(!defects.length){
    status.textContent="Please add a defect.";
    return false;
  }
  if(!/^\d{6}$/.test(sharedUnit.trim())){
    status.textContent="Please enter one six-digit Unit number for all defects.";
    return false;
  }
  for(let i=0;i<defects.length;i++){
    const d=defects[i];
    if(!/^\d{6}$/.test(d.pvn.trim())){
      status.textContent="Please enter a six-digit PVN for Defect "+(i+1)+".";
      return false;
    }
    if(!d.defect.trim()){
      status.textContent="Please enter the defect for Defect "+(i+1)+".";
      return false;
    }
  }
  status.textContent="";
  return true;
}

function buildMessage(){
  return defects.map((d,i)=>`Defect ${i+1}
PVN: ${d.pvn.trim()}
Unit: ${sharedUnit.trim()}
Defect: ${d.defect.trim()}`).join("\n\n");
}

async function copyDefects(){
  if(!validate())return;
  const text=buildMessage();
  try{await navigator.clipboard.writeText(text);}
  catch(e){
    const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy")}catch(err){status.textContent="Unable to copy.";ta.remove();return}ta.remove();
  }
  status.textContent="Defect information copied to clipboard.";
}

function emailDefects(){
  if(!validate())return;
  const hc=document.getElementById("defect-headcode").value.trim();
  const date=new Date().toLocaleDateString("en-GB");
  const subject="Defect Report for "+sharedUnit+" - "+hc+" on "+date;
  const body="Hello,\n\nCould I please log the following defects on the above service.\n\nUNIT: "+sharedUnit+"\n\n"+buildMessage();
  location.href="mailto:?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
}

addDefect();
</script>
<script>
function pdfEscape(t){return String(t||"").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").replace(/\r?\n/g,"\\n");}

      }

    })();
  const pageLines=[]; let page=[];
  lines.forEach(line=>{if(line==="__PAGE__"){pageLines.push(page);page=[]}else{page.push(line)}});
  if(page.length)pageLines.push(page);
  const W=595,H=842, margin=42, fontSize=10, leading=14;
  let objs=[]; const add=x=>{objs.push(x);return objs.length};
  let pagesObj=add(""); let fontObj=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
  let pageRefs=[];
  pageLines.forEach(lines=>{
    let content="BT /F1 10 Tf "+margin+" "+(H-margin)+" Td ";

    content+=" ET";

    pageRefs.push(pageObj);
  });

  let catalog=add("<< /Type /Catalog /Pages "+pagesObj+" 0 R >>");
  let pdf="%PDF-1.4\n", offsets=[0];
  objs.forEach((o,i)=>{offsets.push(pdf.length);pdf+=(i+1)+" 0 obj\n"+o+"\nendobj\n";});
  let xref=pdf.length; pdf+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";

<script id="humanReadableReportTextV152">
(function(){
  function tidyText(text){
    return String(text||"")
      .replace(/[ \t]+\n/g,"\n")
      .replace(/\n{3,}/g,"\n\n")
      .replace(/ +([,.;:!?])/g,"$1")
      .replace(/\bhello,\s*/i,"Hello,\n\n")
      .replace(/\bthanks\s*$/i,"Thanks")
      .trim();
  }
  document.addEventListener("DOMContentLoaded",function(){
    // Apply only to generated report/email previews, not user input fields.
    document.querySelectorAll("#generatedReport,#generatedEmail,#output,#emailPreview,.generated-report,.email-preview,.report-output").forEach(function(el){
      if(el.matches("textarea,input")) return;
      var original=el.textContent;
      if(original && original.trim()) el.textContent=tidyText(original);
    });
  });
})();
</script>

<script id="xc-human-email-v170">
(function(){
  function clean(v){return String(v==null?"":v).trim();}
  function byWords(words){
    const els=[...document.querySelectorAll("input,textarea,select")];
    for(const e of els){
      const meta=((e.id||"")+" "+(e.name||"")+" "+(e.placeholder||"")+" "+
        (e.getAttribute("aria-label")||"")).toLowerCase();
      if(words.some(w=>meta.includes(w))){
        let v=e.tagName==="SELECT"?clean(e.options[e.selectedIndex]?.text||e.value):clean(e.value);
        if(v)return v;
      }
    } return "";
  }
  function date(v){if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const a=v.split("-");return a[2]+"/"+a[1]+"/"+a[0].slice(-2)}return v||"DATE";}
  function writeEmail(r){
    const s=document.querySelector("#emailSubject,#subject,[data-output='subject'],.email-subject");
    const b=document.querySelector("#generatedEmail,#emailBody,#output,#emailPreview,[data-output='body'],.email-preview,.report-output");
    if(s){if("value" in s)s.value=r.subject;else s.textContent=r.subject;}
    if(b){if("value" in b)b.value=r.body;else b.textContent=r.body;}
    return r;
  }
  window.XCEmail={clean,byWords,date,writeEmail};
})();
</script>
