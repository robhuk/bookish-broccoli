<meta name="apple-mobile-web-app-title" content="XC Staff App"><link rel="manifest" href="manifest.json"><link rel="icon" href="xc-staff-app-icon.jpg"><style>
:root{--red:#b5121b;--gold:#f5c242;--bg:#f4f4f4;--text:#222;--muted:#666;--border:#d8d8d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--red);color:#fff;padding:14px 16px;border-bottom:5px solid var(--gold)}
.top{display:flex;align-items:center;gap:12px}.logo{width:185px;height:40px;object-fit:contain;background:transparent}
.back{color:#fff;text-decoration:none;font-weight:800;font-size:14px}.heading{margin-top:10px;font-size:24px;font-weight:850}
main{max-width:650px;margin:auto;padding:18px 16px 35px}.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px #00000010}
label{display:block;font-size:14px;font-weight:800;margin:0 0 7px}input,select,textarea{width:100%;border:1px solid #bbb;border-radius:10px;padding:12px;font:inherit;background:#fff}textarea{min-height:130px;resize:vertical}
.field{margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:13px;color:var(--muted);line-height:1.45}
button{width:100%;border:0;border-radius:11px;padding:14px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:#eee;color:#222}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{text-align:center;color:#666;font-size:13px;margin-top:10px;min-height:18px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 4px;border-bottom:1px solid #ddd;text-align:left}th{font-size:12px}
@media(max-width:480px){.grid,.actions{grid-template-columns:1fr}}

.app-splash{position:fixed;inset:0;z-index:9999;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:1;visibility:visible}
.app-splash img{width:100%;height:100%;object-fit:cover;display:block}
.app-splash.hide{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility .35s ease}
.btp-home-icon{width:34px;height:38px;object-fit:contain;vertical-align:middle;margin-right:7px}
.custom-home-btn{display:flex!important;align-items:center;gap:14px}
.custom-home-btn img{width:52px;height:52px;object-fit:contain;flex:0 0 52px}
</style><style>.home-page-list{display:grid;gap:10px}.home-page-list .homebtn{display:flex;align-items:center;gap:10px;text-decoration:none;background:#fff;color:#222;border-radius:12px;padding:14px;box-shadow:0 2px 8px #0001}.home-page-list .homebtn:hover{background:#f8e9ec}</style>
