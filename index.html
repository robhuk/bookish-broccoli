<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#231f20">
  <title>XC Staff App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><div class="brand"><span class="xc">XC</span> Staff App</div><button class="home-btn" onclick="goHome()">⌂</button></header>

<main id="home" class="screen active">
  <h1>Staff App</h1>
  <p class="hint">Select a form</p>
  <div id="nav" class="nav-grid"></div>
</main>

<main id="formScreen" class="screen">
  <div class="page-head"><button class="back" onclick="goHome()">‹ Back</button><h1 id="pageTitle"></h1>
    <div class="actions"><button title="Save" onclick="saveCurrent()">💾</button><button title="Clear" onclick="clearCurrent()">🗑</button></div>
  </div>
  <form id="form"></form>
  <div class="output-actions">
    <button onclick="generate()">Generate</button>
    <button onclick="copyOutput()">Copy</button>
    <button onclick="window.print()">Print</button>
    <button onclick="exportText()">Export</button>
  </div>
  <section class="output"><h2>Generated Email / Report</h2><div id="subject"></div><pre id="body"></pre></section>
</main>

<script src="app.js"></script>
</body>
</html>
