<div id="status"></div></main><script>
const KEY="xc_staff_app_passenger_counts_v3";
let trains=[];
let reasonNotes="";
function blank(){return {date:new Date().toISOString().slice(0,10),headcode:"",rows:Array.from({length:10},()=>({station:"",first:"",standard:"",entered:false}))}}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function addTrain(){trains.push(blank());render()}
function update(t,k,v){trains[t][k]=v}
function updateRow(t,r,k,v){trains[t].rows[r][k]=v}
function countClass(type,v){const n=Number(v); if(v===""||Number.isNaN(n)) return ""; if(type==="standard"){return n<100?"count-black":n<=150?"count-green":n<=200?"count-orange":"count-red"} return n<=8?"count-black":n<=15?"count-green":n<=20?"count-orange":n<=25?"count-red":"count-red-bold"}
function render(){
 const notes=document.getElementById("reasonNotes"); if(notes && notes.value!==reasonNotes) notes.value=reasonNotes;
 document.getElementById("trains").innerHTML=trains.map((t,ti)=>`
 <section class="train-block">
 <h3>Train ${ti+1}</h3>
 <label>Date</label><input type="date" value="${esc(t.date)}" onchange="update(${ti},'date',this.value)">
 <label>Headcode</label><input value="${esc(t.headcode)}" placeholder="e.g. 1V50" oninput="update(${ti},'headcode',this.value)">
 <table><thead><tr><th>Station</th><th>First Class</th><th>Standard</th><th>Count entered</th></tr></thead>
 <tbody>${t.rows.map((r,ri)=>`<tr>
 <td><input value="${esc(r.station)}" oninput="updateRow(${ti},${ri},'station',this.value)"></td>
 <td><input class="${countClass('first',r.first)}" type="number" inputmode="numeric" value="${esc(r.first)}" oninput="updateRow(${ti},${ri},'first',this.value);render()" min="0" max="999" step="1" inputmode="numeric"></td>
 <td><input class="${countClass('standard',r.standard)}" type="number" inputmode="numeric" value="${esc(r.standard)}" oninput="updateRow(${ti},${ri},'standard',this.value);render()" min="0" max="999" step="1" inputmode="numeric"></td>
 <td style="text-align:center"><input type="checkbox" ${r.entered?"checked":""} onchange="updateRow(${ti},${ri},'entered',this.checked)"></td>
 </tr>`).join("")}</tbody></table>
 </section>`).join("")
}
function saveCounts(){localStorage.setItem(KEY,JSON.stringify({trains,reasonNotes}));show("Passenger counts saved locally.")}
function clearAll(){if(!confirm("Are you sure you want to clear all passenger count data?"))return;trains=[blank()];reasonNotes="";localStorage.removeItem(KEY);render();const n=document.getElementById("reasonNotes");if(n)n.value="";show("All passenger counts cleared.")}
function show(x){document.getElementById("status").textContent=x;setTimeout(()=>document.getElementById("status").textContent="",2500)}

async function makePDF(){
 await loadPDF();
 const doc=new jspdf.jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
 const now=new Date();
 const ts=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+" on "+
   String(now.getDate()).padStart(2,"0")+"/"+String(now.getMonth()+1).padStart(2,"0")+"/"+now.getFullYear();

 trains.forEach((t,i)=>{
   if(i>0)doc.addPage();
   doc.setFillColor(181,18,27);doc.rect(0,0,210,25,"F");
   doc.setTextColor(255,255,255);doc.setFontSize(15);doc.setFont(undefined,"bold");
   doc.text("XC STAFF APP",15,11);doc.setFontSize(11);doc.text("PASSENGER COUNTS",15,19);
   doc.setTextColor(35,35,35);doc.setFontSize(13);doc.text("Train "+(i+1)+"  "+(t.headcode||""),15,35);
   doc.setFontSize(9);doc.setFont(undefined,"normal");
   doc.text("Date: "+(t.date?t.date.split("-").reverse().join("/"):""),15,42);
   const rows=t.rows.filter(r=>r.station||r.first||r.standard).map((r,n)=>[String(n+1),r.station||"",r.first||"",r.standard||""]);
   doc.autoTable({
     startY:48,
     head:[["#","Station","First Class","Standard"]],
     body:rows.length?rows:[["","","",""]],
     theme:"grid",
     margin:{left:15,right:15,bottom:28},
     styles:{font:"helvetica",fontSize:9,cellPadding:3,lineColor:[205,205,205],lineWidth:.25,textColor:[35,35,35],valign:"middle"},
     headStyles:{fillColor:[181,18,27],textColor:[255,255,255],fontStyle:"bold",fontSize:9},
     alternateRowStyles:{fillColor:[248,248,248]},
     columnStyles:{0:{cellWidth:10,halign:"center"},1:{cellWidth:88},2:{cellWidth:42,halign:"center"},3:{cellWidth:42,halign:"center"}}
   });
 });
 xcAddPdfFooters(doc);
 return doc.output("blob");
}

async function generatePDF(){try{let blob=await makePDF();let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="XC-Passenger-Counts.pdf";a.click();show("PDF generated.")}catch(e){show("")}}
async function emailCounts(){
 saveCounts();
 const primary=trains[0]||{};
 const emailDate=primary.date ? primary.date.split("-").reverse().map((v,i)=>i===2?v.slice(-2):v).join("/") : new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"2-digit"});
 const emailHeadcodes=trains.map(t=>(t.headcode||"").trim()).filter(Boolean);
 const subject="PaxCount for "+(emailHeadcodes.length?emailHeadcodes.join(" "):"HEADCODE(s)")+" on "+emailDate;
 let body="Hello,\n\nDue to STAR Mobile not being available, please find counts for the following train(s):\n";
 const notes=(document.getElementById("reasonNotes")?.value||reasonNotes||"").trim();
 if(notes) body+="\nReason / Notes: "+notes+"\n";
 body+="\nPASSENGER COUNTS\n\n";
 trains.forEach((t,i)=>{
   body+="TRAIN "+(i+1)+(t.headcode?" — "+t.headcode:"")+"\n";
   body+="DATE: "+(t.date?t.date.split("-").reverse().join("/"):"")+"\n";
   body+="Station | First Class | Standard | Count entered\n";
   body+="-----------------------------------------------\n";
   t.rows.filter(r=>r.station||r.first||r.standard).forEach(r=>{
     body+=(r.station||"")+" | "+(r.first||"0")+" | "+(r.standard||"0")+" | "+(r.entered?"Yes":"No")+"\n";
   });
   body+="\n";
 });
 location.href="mailto:?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
} 
async function emailPDF(){ return emailCounts(); }

try{trains=JSON.parse(localStorage.getItem(KEY)||"[]");if(!trains.length)trains=[blank()]}catch(e){trains=[blank()]}
render();

function xcGeneratePDF(title){
 const lines=[title,"","XC STAFF APP",""];
 document.querySelectorAll("input,select,textarea").forEach(el=>{
  if(el.value){const l=el.closest(".field")?.querySelector("label")?.innerText||el.name||el.id||"Entry";lines.push(l+": "+el.value)}
 });
 const esc=v=>String(v).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").replace(/\r?\n/g," ");
 const W=595,H=842,m=42,lead=14,pages=[[]];let y=H-m;
 lines.forEach(x=>{if(y<55){pages.push([]);y=H-m}pages.at(-1).push(x);y-=lead});
 let o=[],add=x=>(o.push(x),o.length),po=add(""),fo=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"),refs=[];
 pages.forEach(ls=>{let c="BT /F1 10 Tf "+m+" "+(H-m)+" Td ";ls.forEach((x,i)=>{if(i)c+=" 0 -14 Td ";c+="("+esc(x)+") Tj "});c+=" ET";let st=add("<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream");refs.push(add("<< /Type /Page /Parent "+po+" 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /Font << /F1 "+fo+" 0 R >> >> /Contents "+st+" 0 R >>"))});
 o[po-1]="<< /Type /Pages /Count "+refs.length+" /Kids ["+refs.map(x=>x+" 0 R").join(" ")+"] >>";
 let cat=add("<< /Type /Catalog /Pages "+po+" 0 R >>"),pdf="%PDF-1.4\n",off=[0];
 o.forEach((x,i)=>{off.push(pdf.length);pdf+=(i+1)+" 0 obj\n"+x+"\nendobj\n"});
 let xr=pdf.length;pdf+="xref\n0 "+(o.length+1)+"\n0000000000 65535 f \n";for(let i=1;i<off.length;i++)pdf+=String(off[i]).padStart(10,"0")+" 00000 n \n";
 pdf+="trailer\n<< /Size "+(o.length+1)+" /Root "+cat+" 0 R >>\nstartxref\n"+xr+"\n%%EOF";
 let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([pdf],{type:"application/pdf"}));a.download=title.replace(/[^a-z0-9]+/gi,"-")+".pdf";a.click();
}

<script>
(function(){
  const key='xc_page_data_'+location.pathname.split('/').pop();
  function fields(){return [...document.querySelectorAll('input,textarea,select')].filter(e=>e.type!=='button'&&e.type!=='submit'&&e.type!=='reset');}
  function save(){const data={};fields().forEach((e,i)=>{const k=e.id||e.name||('field_'+i);data[k]={v:e.type==='checkbox'?e.checked:e.value,t:e.type};});localStorage.setItem(key,JSON.stringify(data));alert('Data saved.');}
  function clear(){if(!confirm('Are you sure you want to clear all data on this page?'))return;fields().forEach(e=>{if(e.type==='checkbox'||e.type==='radio')e.checked=false;else if(e.type!=='hidden')e.value='';e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));});localStorage.removeItem(key);}
  function restore(){try{const data=JSON.parse(localStorage.getItem(key)||'{}');fields().forEach((e,i)=>{const k=e.id||e.name||('field_'+i),d=data[k];if(!d)return;if(e.type==='checkbox')e.checked=!!d.v;else e.value=d.v;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));});}catch(_){}}
  document.addEventListener('DOMContentLoaded',()=>{
    const bar=document.createElement('div');bar.className='global-page-data-controls';bar.innerHTML='<button type="button" aria-label="Save data" title="Save data">💾</button><button type="button" aria-label="Clear data" title="Clear data">🗑️</button>';document.body.appendChild(bar);
    bar.children[0].addEventListener('click',save);bar.children[1].addEventListener('click',clear);restore();
  });
})();
</script>

<script id="passenger-count-validation-v151">
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('input[type="number"]').forEach(function (input) {
    input.addEventListener('input', function () {
      var digits = this.value.replace(/\D/g, '').slice(0, 3);
      if (digits === '') { this.value = ''; return; }
      var n = parseInt(digits, 10);
      if (!Number.isFinite(n)) { this.value = ''; return; }
      this.value = Math.min(999, Math.max(0, n));
    });
    input.addEventListener('keydown', function (e) {
      if (['e','E','+','-','.'].includes(e.key)) e.preventDefault();
    });
  });
});
</script>

<script id="humanReadableReportTextV152">
(function(){
  function tidyText(text){
    return String(text||"")
      .replace(/[ \t]+\n/g,"\n")
      .replace(/\n{3,}/g,"\n\n")
      .replace(/ +([,.;:!?])/g,"$1")
      .replace(/\bhello,\s*/i,"Hello,\n\n")
      .replace(/\bthanks\s*$/i,"Thanks")
      .trim();
  }
  document.addEventListener("DOMContentLoaded",function(){
    // Apply only to generated report/email previews, not user input fields.
    document.querySelectorAll("#generatedReport,#generatedEmail,#output,#emailPreview,.generated-report,.email-preview,.report-output").forEach(function(el){
      if(el.matches("textarea,input")) return;
      var original=el.textContent;
      if(original && original.trim()) el.textContent=tidyText(original);
    });
  });
})();
</script>



<script id="xc-form-email-fields-v165">
(function(){
 function clean(v){return String(v==null?"":v).trim();}
 function labelFor(el){
   if(el.labels&&el.labels.length)return clean(el.labels[0].innerText).replace(/[:*]\s*$/,"");
   if(el.id){const l=document.querySelector('label[for="'+el.id+'"]');if(l)return clean(l.innerText).replace(/[:*]\s*$/,"");}
   const wrap=el.closest(".field,.form-group,.input-group,.row,div");
   const l=wrap&&wrap.querySelector("label");
   return clean(l?l.innerText:(el.getAttribute("aria-label")||el.placeholder||el.name||el.id||"Information")).replace(/[:*]\s*$/,"");
 }
 window.xcFormFieldDataV165=function(){
   const out=[];
   document.querySelectorAll("input,textarea,select").forEach(el=>{
     if(el.disabled||el.type==="hidden"||/^(button|submit|reset)$/i.test(el.type))return;
     if((el.type==="checkbox"||el.type==="radio")&&!el.checked)return;
     let v=el.tagName==="SELECT"?clean(el.options[el.selectedIndex]?.text||el.value):clean(el.value);
     if(el.type==="checkbox")v=el.checked?"Yes":"No";
     if(v)out.push({label:labelFor(el),value:v});
   });
   return out;
 };
 window.xcFormFieldsAsTextV165=function(){
   return window.xcFormFieldDataV165().map(x=>x.label+": "+x.value).join("\n");
 };
})();
</script>

<script id="passenger-count-full-table-v167">
(function(){
  function clean(v){return String(v==null?"":v).trim();}
  function findLabel(el){
    if(el.labels&&el.labels.length) return clean(el.labels[0].innerText);
    if(el.id){const l=document.querySelector('label[for="'+el.id+'"]');if(l)return clean(l.innerText);}
    return "";
  }
  function tableText(){
    const table=document.querySelector("table");
    if(!table) return "";
    const lines=[];
    const rows=[...table.querySelectorAll("tr")];
    rows.forEach((row,i)=>{
      const cells=[...row.querySelectorAll("th,td")];
      const vals=cells.map(cell=>{
        const control=cell.querySelector("input,select,textarea");
        if(control){
          if(control.type==="checkbox") return control.checked ? "Yes" : "";
          if(control.tagName==="SELECT") return clean(control.options[control.selectedIndex]?.text||control.value);
          return clean(control.value);
        }
        return clean(cell.innerText);
      });
      if(vals.some(v=>v)) lines.push(vals.join(" | "));
    });
    return lines.join("\n");
  }
  window.buildPassengerCountExportV167=function(){
    const date=(document.getElementById("date")||{}).value||"";
    const headcodes=[...document.querySelectorAll('input[name*="head" i],input[id*="head" i]')]
      .map(e=>clean(e.value)).filter(Boolean);
    const reasonEl=[...document.querySelectorAll("textarea,input")].find(e=>{
      const t=(e.id+" "+e.name+" "+e.placeholder+" "+findLabel(e)).toLowerCase();
      return t.includes("reason")||t.includes("notes");
    });
    const reason=reasonEl?clean(reasonEl.value):"";
    let body="Due to STAR Mobile not being available, please find counts for the following train(s):";
    if(reason) body+="\n\nReason/Notes: "+reason;
    body+="\n\nPassenger Counts:\n"+tableText().split("\n").map(line=>line.split("|").filter(cell=>clean(cell).toLowerCase()!=="count entered"&&clean(cell).toLowerCase()!=="yes"&&clean(cell).toLowerCase()!=="no").join("|").trim()).join("\n");
    return {subject:`PaxCount for ${headcodes.length?headcodes.join(", "):"HEADCODE(s)"} on ${date||"DATE"}`,body};
  };

  document.addEventListener("DOMContentLoaded",function(){
    document.querySelectorAll("button,a,[role='button']").forEach(function(el){
      const t=((el.textContent||"")+" "+(el.getAttribute("aria-label")||"")+" "+(el.title||"")).toLowerCase();
      if(/email|share/.test(t)){
        el.addEventListener("click",function(){
          const r=window.buildPassengerCountExportV167();
          setTimeout(function(){
            const subj=document.querySelector("#emailSubject,#subject,[data-output='subject'],.email-subject");
            const body=document.querySelector("#generatedEmail,#emailBody,#output,#emailPreview,[data-output='body'],.email-preview,.report-output");
            if(subj){if("value" in subj)subj.value=r.subject;else subj.textContent=r.subject;}
            if(body){if("value" in body)body.value=r.body;else body.textContent=r.body;}
          },0);
        });
      }
    });
  });
})();
</script>
</body></html>
